<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropSync - {{ get_text('login') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</head>

<body>
    <div id="global-loading-screen">
        <div class="loading-spinner-container">
            <div class="loading-sprout-icon">
                <svg viewBox="0 0 24 24"><path d="M17 8C14 8 11.5 9.5 10 12C8.5 9.5 6 8 3 8C3 13 7 17 12 21C17 17 21 13 21 8C18 8 17 8 17 8Z"/></svg>
            </div>
            <div class="loading-text">Loading CropSync...</div>
            <div class="loading-bar"><div class="loading-bar-progress"></div></div>
        </div>
    </div>

    <script>
        (function() {
            function hideLoader() {
                const loader = document.getElementById('global-loading-screen');
                if (loader) {
                    loader.classList.add('hidden');
                    loader.style.display = 'none';
                }
            }
            function showLoader() {
                const loader = document.getElementById('global-loading-screen');
                if (loader) {
                    loader.style.display = 'flex';
                    loader.classList.remove('hidden');
                }
            }
            window.showLoader = showLoader;
            window.hideLoader = hideLoader;

            if (document.readyState === 'complete') hideLoader();
            else {
                window.addEventListener('load', hideLoader);
                document.addEventListener('DOMContentLoaded', hideLoader);
            }
            window.addEventListener('pageshow', hideLoader);

            document.addEventListener('click', function(e) {
                const target = e.target.closest('a, button, input[type="submit"], .btn');
                if (target) {
                    if (target.id === 'theme-toggle' || target.classList.contains('mobile-toggle')) return;
                    const href = target.getAttribute('href');
                    if (href && (href.startsWith('#') || href.startsWith('javascript:'))) return;
                    showLoader();
                }
            }, true);

            document.addEventListener('submit', function() {
                showLoader();
            }, true);
        })();
    </script>

    <div class="container">

        <div class="nav">
            <div style="font-weight: 800;"><a href="{{ url_for('home') }}"
                    style="border:none; padding:0; background:none; color:inherit;">CropSync</a></div>
            <div class="nav-links">
                <a href="{{ url_for('register') }}" class="btn" style="padding: 0.25rem 0.6rem; font-size: 0.75rem; background: #27ae60; border-color: #27ae60; color: #ffffff; text-decoration: none;">Register</a>
                <button id="theme-toggle" class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">🌓 Theme</button>
            </div>
        </div>

        <div style="max-width: 400px; margin: 4rem auto;">
            <h2 style="text-align: center;">{{ get_text('welcome_back') }}</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">
                    <label>{{ get_text('email') }}</label>
                    <input type="email" id="emailInput" name="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label>{{ get_text('password') }}</label>
                    <input type="password" id="passwordInput" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" style="width: 100%;">{{ get_text('login') }}</button>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="{{ url_for('register') }}" style="color: var(--primary-color, #27ae60); font-weight: 600; text-decoration: none;">Don't have an account? Create / Register Here →</a>
                </div>
            </form>
        </div>

        <script>
            document.getElementById('theme-toggle').addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        </script>
    </div>
</body>

</html>
